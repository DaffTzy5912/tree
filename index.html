<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My LinkTree</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="music.css">
</head>
<body>
  <div class="container">
    <div class="profile">
      <img src="assets/1000061052-removebg-preview.png" alt="Profile" />
      <h1>XdpzQ</h1>
      <p>@XdpzQ</p>
    </div>

    <ul class="links">
      <li><a href="https://instagram.com" target="_blank">Instagram</a></li>
      <li><a href="https://twitter.com" target="_blank">Twitter</a></li>
      <li><a href="https://github.com" target="_blank">GitHub</a></li>
      <li><a href="https://youtube.com" target="_blank">YouTube</a></li>
    </ul>

    <div class="music-player">
      <div class="music-box">
        <div class="music-header">
          <img src="https://files.catbox.moe/i0a8x0.jpg" alt="Cover" class="cover" />
          <div class="info">
            <h3>Cinta Sejati</h3>
            <p>________</p>
            <p class="lyric">________<br/>________</p>
          </div>
        </div>
        <audio id="audio" src="https://files.catbox.moe/8xqkkw.opus"></audio>
        <div class="controls">
          <span id="current-time">0:00</span>
          <button id="play-btn">▶</button>
          <span id="duration">0:49</span>
        </div>
      </div>
    </div>
  </div>

  <script>
  const audio = document.getElementById('audio');
const playBtn = document.getElementById('play-btn');
const currentTime = document.getElementById('current-time');
const duration = document.getElementById('duration');

let playing = false;

playBtn.addEventListener('click', () => {
  if (playing) {
    audio.pause();
    playBtn.textContent = '▶';
  } else {
    audio.play();
    playBtn.textContent = '⏸';
  }
  playing = !playing;
});

audio.addEventListener('timeupdate', () => {
  const minutes = Math.floor(audio.currentTime / 60);
  const seconds = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
  currentTime.textContent = `${minutes}:${seconds}`;
});

audio.addEventListener('loadedmetadata', () => {
  const totalMinutes = Math.floor(audio.duration / 60);
  const totalSeconds = Math.floor(audio.duration % 60).toString().padStart(2, '0');
  duration.textContent = `${totalMinutes}:${totalSeconds}`;
});
  </script>
</body>
</html>
