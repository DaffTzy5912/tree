<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My LinkTree</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;500;700&display=swap" rel="stylesheet">

  <!-- CSS External -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="profile">
      <img src="assets/profile.jpg" alt="Profile" />
      <h1>Your Name</h1>
      <p>@yourusername</p>
    </div>

    <ul class="links">
      <li><a href="https://instagram.com" target="_blank">Instagram</a></li>
      <li><a href="https://twitter.com" target="_blank">Twitter</a></li>
      <li><a href="https://github.com" target="_blank">GitHub</a></li>
      <li><a href="https://youtube.com" target="_blank">YouTube</a></li>
    </ul>

    <div class="music-player">
      <div class="music-box">
        <div class="music-header">
          <img src="assets/cover.jpg" alt="Cover" class="cover" />
          <div class="info">
            <h3>五等分の気持ち</h3>
            <p>Nakanoke no Itsutsugo</p>
            <p class="lyric">喜びも (Kebahagiaan juga)<br/>悲しみも (Dan kesedihan)</p>
          </div>
        </div>
        <audio id="audio" src="assets/music.mp3"></audio>
        <div class="controls">
          <span id="current-time">0:00</span>
          <button id="play-btn">▶</button>
          <span id="duration">3:42</span>
        </div>
      </div>
    </div>
  </div>

  <!-- JS External -->
  <script src="script.js"></script>
</body>
</html>
